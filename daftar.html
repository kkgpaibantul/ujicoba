<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#533B4D" />
<title>Pendaftaran Ofisial — MTQ 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
/* ============================================================
 * §1 DESIGN TOKENS & RESET
 * ============================================================ */
:root {
  --cream: #FFF5E4;
  --cream-2: #FBEDD9;
  --blush: #FAC3C1;
  --rose: #FAA4BD;
  --rose-deep: #533B4D;
  --accent-pink: #F599C6;
  --hijau: #2F6F53;
  --hijau-l: #D8F0E2;
  --gold: #D9A441;
  --gold-l: #FEF3C7;
  --ink: #3E4C63;
  --ink-l: #6B7A8F;
  --surface: #FFFFFF;
  --border: #E8DDD4;
  --danger: #C53030;
  --danger-l: #FEE2E2;

  --shadow-s: 0 1px 2px rgba(83,59,77,.06);
  --shadow-m: 0 4px 12px -4px rgba(83,59,77,.12);
  --r: 16px;
  --r-s: 10px;
  --t: .18s cubic-bezier(.4,0,.2,1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
  background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
  color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased;
  min-height: 100vh; min-height: 100dvh;
}
h1, h2, h3, h4 { font-family: 'Fraunces', Georgia, serif; line-height: 1.2; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 16px; }
a { color: inherit; text-decoration: none; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin .8s linear infinite; flex-shrink: 0; }

/* ============================================================
 * §2 APP SHELL & APPBAR
 * ============================================================ */
#app { width: 100%; max-width: 800px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.screen { display: none; flex: 1; padding: 1rem; padding-bottom: calc(2rem + env(safe-area-inset-bottom)); }
.screen.active { display: flex; flex-direction: column; animation: fadeUp .25s ease; }

.appbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--rose-deep); color: var(--cream);
  padding: .75rem 1rem; padding-top: calc(.75rem + env(safe-area-inset-top));
  display: flex; align-items: center; gap: .6rem;
  border-bottom: 3px solid var(--accent-pink);
  box-shadow: 0 2px 12px rgba(83,59,77,.25);
}
.appbar-back { padding: .4rem; border-radius: 8px; transition: var(--t); flex-shrink: 0; display: flex; }
.appbar-back:hover { background: rgba(255,255,255,.1); }
.appbar-back svg { width: 20px; height: 20px; }
.appbar-title { flex: 1; font-weight: 700; font-size: 1rem; line-height: 1.2; }
.appbar-title small { display: block; font-size: .7rem; opacity: .75; font-weight: 500; }
.appbar-btn { padding: .45rem .7rem; border-radius: 8px; font-size: .78rem; font-weight: 700; background: rgba(255,255,255,.12); display: flex; align-items: center; gap: .3rem; }
.appbar-btn:hover { background: rgba(255,255,255,.22); }
.appbar-btn svg { width: 14px; height: 14px; }

/* ============================================================
 * §3 COMMON UI (Card, Btn, Form)
 * ============================================================ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-s); padding: 1.2rem; margin-bottom: 1rem; }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: .45rem; padding: .8rem 1.1rem; border-radius: var(--r-s); font-size: .92rem; font-weight: 700; transition: var(--t); min-height: 46px; width: 100%; text-align: center; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--rose-deep); color: var(--cream); box-shadow: 3px 3px 0 rgba(83,59,77,.15); }
.btn-primary:hover { background: #6a4a60; }
.btn-success { background: var(--hijau); color: var(--cream); box-shadow: 3px 3px 0 rgba(47,111,83,.2); }
.btn-success:hover { background: #257045; }
.btn-accent { background: var(--accent-pink); color: var(--rose-deep); box-shadow: 3px 3px 0 rgba(245,153,198,.4); }
.btn-accent:hover { background: #f285bb; }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: var(--cream); border-color: var(--rose); }
.btn-danger { background: var(--danger-l); color: var(--danger); }
.btn-sm { padding: .4rem .8rem; font-size: .75rem; min-height: 34px; width: auto; }

.form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: .35rem; }
.form-group label { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-l); }
.form-group label .req { color: var(--danger); }
.form-input { width: 100%; padding: .75rem .85rem; border: 1.5px solid var(--border); border-radius: var(--r-s); font-size: 16px; font-weight: 500; color: var(--ink); background: var(--surface); transition: var(--t); outline: none; }
.form-input:focus { border-color: var(--rose-deep); box-shadow: 0 0 0 3px rgba(83,59,77,.1); }
.form-input.invalid { border-color: var(--danger); background: var(--danger-l); }
.radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.radio-btn { padding: .65rem; border: 1.5px solid var(--border); border-radius: var(--r-s); font-size: .9rem; font-weight: 700; text-align: center; background: var(--surface); color: var(--ink); cursor: pointer; transition: var(--t); }
.radio-btn.active { border-color: var(--rose-deep); background: var(--rose-deep); color: var(--cream); }

/* ============================================================
 * §4 DASHBOARD (LIST CABANG)
 * ============================================================ */
.quota-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.2rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-s); }
.quota-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
.quota-row h3 { font-size: 1rem; color: var(--rose-deep); font-family: 'Plus Jakarta Sans'; }
.quota-val { font-weight: 800; font-size: 1rem; color: var(--rose-deep); }
.quota-bar { height: 8px; background: var(--cream); border-radius: 4px; overflow: hidden; }
.quota-bar-fill { height: 100%; background: var(--accent-pink); border-radius: 4px; transition: width .35s; }
.quota-bar-fill.warn { background: var(--gold); }
.quota-bar-fill.full { background: var(--danger); }

.section-title { font-size: 1rem; font-weight: 800; color: var(--rose-deep); margin: 1.5rem 0 .75rem; font-family: 'Plus Jakarta Sans'; display: flex; align-items: center; gap: .5rem; }
.cabang-list { display: flex; flex-direction: column; gap: .75rem; }

.cabang-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem; display: flex; align-items: flex-start; gap: 1rem; transition: var(--t); }
.cabang-item.empty { border-style: dashed; }
.cabang-item.filled { border-left: 4px solid var(--hijau); }
.cabang-item.disabled { opacity: .6; background: var(--cream); }

.cabang-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--blush); color: var(--rose-deep); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .8rem; flex-shrink: 0; }
.cabang-info { flex: 1; min-width: 0; }
.cabang-info h4 { font-size: 1rem; font-family: 'Plus Jakarta Sans'; font-weight: 800; color: var(--ink); margin-bottom: .2rem; }
.cabang-info p { font-size: .8rem; color: var(--ink-l); margin: 0; line-height: 1.4; }
.cabang-info .badge { display: inline-flex; align-items: center; gap: .2rem; padding: .2rem .5rem; border-radius: 4px; font-size: .65rem; font-weight: 800; margin-top: .4rem; margin-right: .3rem; }
.badge.warn { background: var(--gold-l); color: #92400e; }
.badge.ok { background: var(--hijau-l); color: var(--hijau); }

.cabang-actions { display: flex; flex-direction: column; gap: .4rem; flex-shrink: 0; }
.cabang-actions .btn { padding: .4rem .6rem; min-height: 34px; font-size: .75rem; white-space: nowrap; }

/* ============================================================
 * §5 CUSTOM SEARCHABLE PICKER (SEKOLAH)
 * ============================================================ */
.picker-container { position: relative; }
.picker-trigger { width: 100%; padding: .75rem .85rem; border: 1.5px solid var(--border); border-radius: var(--r-s); background: var(--surface); font-size: 15px; font-weight: 500; color: var(--ink); text-align: left; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: var(--t); }
.picker-trigger:hover { border-color: var(--rose-deep); }
.picker-trigger.active { border-color: var(--rose-deep); box-shadow: 0 0 0 3px rgba(83,59,77,.1); }
.picker-trigger .placeholder { color: var(--ink-l); }
.picker-trigger svg { width: 16px; height: 16px; color: var(--ink-l); transition: transform .2s; }
.picker-trigger.active svg { transform: rotate(180deg); }

.picker-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-s); box-shadow: 0 10px 25px -5px rgba(0,0,0,.15); z-index: 50; display: none; flex-direction: column; max-height: 300px; overflow: hidden; }
.picker-dropdown.show { display: flex; }
.picker-search-wrap { padding: .6rem; border-bottom: 1px solid var(--border); position: relative; background: var(--surface); }
.picker-search-wrap svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--ink-l); }
.picker-search { width: 100%; padding: .55rem .55rem .55rem 2rem; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; background: var(--cream); }
.picker-list { overflow-y: auto; flex: 1; padding: .4rem; -webkit-overflow-scrolling: touch; }
.picker-group-label { font-size: .65rem; font-weight: 800; text-transform: uppercase; color: var(--ink-l); padding: .4rem .6rem .2rem; letter-spacing: .05em; position: sticky; top: 0; background: var(--surface); }
.picker-option { padding: .65rem .6rem; border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: .5rem; transition: background .1s; }
.picker-option:hover { background: var(--cream); }
.picker-option.selected { background: var(--blush); color: var(--rose-deep); font-weight: 700; }
.picker-option.manual-option { color: var(--gold); font-weight: 700; border-top: 1px dashed var(--border); margin-top: .4rem; border-radius: 0 0 6px 6px; }
.picker-option.manual-option:hover { background: var(--gold-l); }

/* ============================================================
 * §6 FORM LAYOUT & UPLOAD BOX
 * ============================================================ */
.member-group { border: 1px solid var(--border); border-radius: var(--r-s); padding: 1.2rem; margin-bottom: 1rem; background: var(--cream); position: relative; margin-top: 1rem; }
.member-label { position: absolute; top: -.6rem; left: 1rem; background: var(--surface); color: var(--rose-deep); font-size: .7rem; font-weight: 800; padding: .1rem .6rem; border-radius: 4px; border: 1px solid var(--border); text-transform: uppercase; letter-spacing: .05em; }

.upload-box { display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 2px dashed var(--border); border-radius: var(--r-s); background: var(--surface); cursor: pointer; transition: var(--t); margin-bottom: .75rem; }
.upload-box:hover { border-color: var(--rose-deep); background: var(--cream); }
.upload-box.has-file { border-style: solid; border-color: var(--hijau); background: var(--hijau-l); cursor: default; }
.upload-box.uploading { border-color: var(--rose-deep); background: var(--blush); cursor: wait; }
.upload-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--cream); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.upload-box.has-file .upload-icon { background: var(--hijau); }
.upload-icon svg { width: 20px; height: 20px; color: var(--rose-deep); }
.upload-box.has-file .upload-icon svg { color: var(--cream); }
.upload-info { flex: 1; }
.upload-title { font-size: .9rem; font-weight: 800; color: var(--ink); margin-bottom: .2rem; }
.upload-sub { font-size: .75rem; color: var(--ink-l); }
.upload-box.has-file .upload-title { color: var(--hijau); }

/* Toast */
.toast-wrap { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 200; width: calc(100% - 32px); max-width: 400px; display: flex; flex-direction: column; gap: .5rem; pointer-events: none; }
.toast { display: flex; align-items: center; gap: .5rem; padding: .8rem 1rem; border-radius: var(--r-s); color: #fff; font-size: .85rem; font-weight: 600; box-shadow: var(--shadow-m); animation: fadeUp .3s; }
.toast.success { background: var(--hijau); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--rose-deep); }

/* ============================================================
 * §7 RESPONSIVE (DESKTOP)
 * ============================================================ */
@media (min-width: 768px) {
  .cabang-list { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-grid .full-width { grid-column: span 2; }
}
</style>
</head>
<body>

<div id="app">
  <header class="appbar" id="appbar" style="display:none">
    <button class="appbar-back" id="btnBack" aria-label="Kembali" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="appbar-title">
      <span id="appbarTitleText">MTQ 2026</span>
      <small id="appbarTitleSub">Pendaftaran Ofisial</small>
    </div>
    <button class="appbar-btn" id="btnLogout" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Keluar
    </button>
  </header>
  <main id="main"></main>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
'use strict';
(() => {

/* ============================================================
 * KONFIGURASI & STATE
 * ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbxK9HQwo5_qqME-Vus5JNbHMO3HaJRELMAhlVjsOfO65uKlh_MdjwaexaQyRIQ2FVQlQQ/exec';
const LS_TOKEN = 'mtq_ofisial_token';
const LS_OFISIAL = 'mtq_ofisial_data';

const KAPANEWON_LIST = ['Bambanglipuro','Banguntapan','Bantul','Dlingo','Imogiri','Jetis','Kasihan','Kretek','Pajangan','Pandak','Piyungan','Pleret','Pundong','Sanden','Sedayu','Sewon','Srandakan'];
const FALLBACK_CABANG = [
  { key:'MTQ', kode:'MTQ', label:"MTQ (Tilawah)", slot:1, team:false },
  { key:'MTtQ', kode:'MTTQ', label:"MTtQ (Tartil)", slot:1, team:false },
  { key:'MHQ', kode:'MHQ', label:"MHQ (Hifdzil)", slot:1, team:false },
  { key:'Puitisasi', kode:'MPI', label:'MPI (Puitisasi)', slot:1, team:false },
  { key:'MAz', kode:'MAZ', label:'MAz (Adzan)', slot:1, team:false, gender:'L' },
  { key:'LPP', kode:'LPP', label:'LPP (Pidato)', slot:1, team:false },
  { key:'LCP', kode:'LCP', label:'LCP (Cerdas Cermat)', slot:3, team:true },
  { key:'Lukis', kode:'LMI', label:'LMI (Melukis)', slot:1, team:false },
  { key:'Menyanyi', kode:'LMYI', label:'LMyI (Menyanyi)', slot:1, team:false }
];

const State = {
  token: null, ofisial: null, config: {}, cabang: [], sekolah: [], peserta: [],
  kuota: 11, slotTerpakai: 0, cabangMap: {}, currentForm: null, regSekolah: []
};

/* ============================================================
 * UTIL
 * ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

async function api(action, payload = {}) {
  const body = Object.assign({ action }, payload);
  if (State.token && !body.token && action !== 'register_ofisial' && action !== 'resend_token') body.token = State.token;
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

function toast(msg, type = 'success') {
  const wrap = $('#toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}

/* ============================================================
 * NAVIGASI SCREEN & APPBAR
 * ============================================================ */
function setAppbar(opts = {}) {
  const bar = $('#appbar');
  if (!opts.show) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  $('#btnBack').hidden = !opts.back;
  $('#btnLogout').hidden = !opts.logout;
  $('#appbarTitleText').textContent = opts.title || 'MTQ 2026';
  $('#appbarTitleSub').textContent = opts.sub || 'Pendaftaran Ofisial';
}

function showScreen(name, renderFn) {
  $('#main').innerHTML = '';
  const screen = document.createElement('div');
  screen.className = 'screen active';
  screen.id = 'screen-' + name;
  $('#main').appendChild(screen);
  renderFn(screen);
}

/* ============================================================
 * BOOT & SESSION
 * ============================================================ */
async function boot() {
  try {
    const res = await api('config');
    if (res.status === 'success') {
      State.config = res.config || {};
      State.cabang = (res.cabang && res.cabang.length) ? res.cabang : FALLBACK_CABANG;
    } else throw new Error('bad');
  } catch (e) {
    State.config = { kuota_per_kapanewon: '11', pendaftaran_buka: 'true', wajib_akta: 'true' };
    State.cabang = FALLBACK_CABANG;
  }
  State.cabangMap = {};
  State.cabang.forEach(c => { State.cabangMap[c.key] = c; });
  State.kuota = parseInt(State.config.kuota_per_kapanewon, 10) || 11;

  const token = lsGet(LS_TOKEN);
  const ofisial = lsGet(LS_OFISIAL);
  
  if (token && ofisial) {
    State.token = token; State.ofisial = ofisial;
    showScreen('loading', s => { s.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--ink-l)">Memuat data...</div>'; });
    try {
      const list = await api('list_peserta');
      if (list.status === 'success') {
        State.ofisial = list.ofisial || ofisial;
        State.peserta = list.peserta || [];
        State.slotTerpakai = list.slot_terpakai || 0;
        
        const sek = await api('sekolah_list', { kapanewon: State.ofisial.Kapanewon });
        if (sek.status === 'success') State.sekolah = sek.sekolah || [];
        
        renderDashboard();
        return;
      }
    } catch (e) {}
    lsDel(LS_TOKEN); lsDel(LS_OFISIAL);
  }
  renderLanding();
}

/* ============================================================
 * SCREEN: LANDING
 * ============================================================ */
function renderLanding() {
  setAppbar({ show: false });
  showScreen('landing', s => {
    const isOpen = String(State.config.pendaftaran_buka).toLowerCase() === 'true';
    s.innerHTML = `
      <div style="text-align:center;padding:3rem 1rem;">
        <div style="width:80px;height:80px;margin:0 auto 1.5rem;background:var(--rose-deep);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(83,59,77,.4);">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="40" height="40"><path d="M12 2L3 7v6c0 5 4 9 9 11 5-2 9-6 9-11V7l-9-5z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <h1 style="font-size:1.8rem;font-weight:900;color:var(--rose-deep);margin-bottom:.5rem;">Pendaftaran Ofisial</h1>
        <p style="color:var(--ink-l);margin-bottom:2rem;">MTQ Pelajar SD Kabupaten Bantul 2026</p>
        
        ${!isOpen ? `<div style="background:var(--gold-l);border:1px solid var(--gold);padding:.8rem;border-radius:8px;margin-bottom:1.5rem;font-size:.85rem;color:#92400e;font-weight:700;">⚠ Pendaftaran Belum Dibuka / Sudah Ditutup</div>` : ''}

        <div style="display:flex;flex-direction:column;gap:.75rem;max-width:300px;margin:0 auto;">
          <button class="btn btn-primary" id="btnGoLogin">Masuk (Punya Token)</button>
          <button class="btn btn-accent" id="btnGoRegister" ${!isOpen?'disabled':''}>Daftar Ofisial Baru</button>
        </div>
        <div style="margin-top:1.5rem;"><a href="index.html" style="font-size:.8rem;color:var(--ink-l);">← Beranda</a></div>
      </div>
    `;
    $('#btnGoLogin').onclick = renderLogin;
    $('#btnGoRegister').onclick = renderRegister;
  });
}

/* ============================================================
 * SCREEN: LOGIN
 * ============================================================ */
function renderLogin() {
  setAppbar({ show: true, back: true, title: 'Login Ofisial', sub: 'Masukkan token email' });
  $('#btnBack').onclick = renderLanding;

        </div>
        <button class="btn btn-primary" id="btnDoLogin">Masuk</button>

          <button class="btn btn-ghost btn-sm" id="btnForgot">Lupa Token?</button>
        </div>
      </div>
    `;

    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8); });
    inp.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const token = $('#inpToken').value.trim().toUpperCase();
  if (token.length !== 8) return toast('Token harus 8 karakter.', 'error');
  const btn = $('#btnDoLogin'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const res = await api('login_ofisial', { token });
    if (res.error) throw new Error(res.message);
    lsSet(LS_TOKEN, token); lsSet(LS_OFISIAL, res.ofisial);
    State.token = token; State.ofisial = res.ofisial;
    boot(); // Reload with session
  } catch (e) {
    toast(e.message || 'Login gagal.', 'error');
    btn.disabled = false; btn.textContent = 'Masuk';
  }
}

function renderForgot() {
  setAppbar({ show: true, back: true, title: 'Lupa Token', sub: 'Kirim ulang via email' });
  $('#btnBack').onclick = renderLogin;
  showScreen('forgot', s => {
    s.innerHTML = `
      <div class="card" style="max-width:400px;margin:2rem auto;">
        <div class="form-group">
          <label>Email Terdaftar <span class="req">*</span></label>
          <input type="email" class="form-input" id="inpEmail" placeholder="nama@email.com" autocomplete="email" />
        </div>
        <button class="btn btn-primary" id="btnResend">Kirim Ulang Token</button>
      </div>
    `;
    $('#btnResend').onclick = async (e) => {
      const email = $('#inpEmail').value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Format email salah.', 'error');
      const btn = e.currentTarget; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
      try {
        const res = await api('resend_token', { payload: { Email: email } });
        toast('Jika email terdaftar, token telah dikirim.', 'success');
        setTimeout(renderLogin, 2000);
      } catch (err) {
        toast('Gagal kirim.', 'error'); btn.disabled = false; btn.textContent = 'Kirim Ulang Token';
      }
    };
  });
}

// Fungsi pembuat UI Picker (Reusable untuk form daftar & form peserta)
function renderPickerUI(wrap, list, onSelect) {
  const currentVal = '';
  const isManual = false;
  
  if (!list || list.length === 0) {
    wrap.innerHTML = `
      <div style="background:var(--gold-l);padding:1rem;border-radius:8px;border:1px solid var(--gold);">
        <p style="font-size:.75rem;font-weight:800;color:#92400e;margin-bottom:.5rem;">⚠ Belum ada data sekolah. Isi manual:</p>
        <input type="text" class="form-input" id="inpManual" placeholder="NAMA SEKOLAH..." style="text-transform:uppercase;">
      </div>
    `;
    $('#inpManual').oninput = e => {
      e.target.value = e.target.value.toUpperCase();
      onSelect(e.target.value, true);
    };
    return;
  }

  const negeri = list.filter(s => /negeri/i.test(s.Status_Sekolah || '') || /negeri/i.test(s.Nama));
  const swasta = list.filter(s => !(/negeri/i.test(s.Status_Sekolah || '') || /negeri/i.test(s.Nama)));

  wrap.innerHTML = `
    <div class="picker-container">
      <button type="button" class="picker-trigger" id="pTrigger">
        <span class="placeholder">Pilih Sekolah...</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="picker-dropdown" id="pDropdown">
        <div class="picker-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="picker-search" id="pSearch" placeholder="Cari sekolah..." autocomplete="off">
        </div>
        <div class="picker-list" id="pList">
          <div class="picker-group-label">SD Negeri</div>
          <div class="picker-group" data-g="n">
            ${negeri.map(s => `<div class="picker-option" data-v="${esc(s.Nama)}" data-s="${esc(s.Nama.toUpperCase())}">${esc(s.Nama)}</div>`).join('')}
          </div>
          <div class="picker-group-label">SD / MI Swasta</div>
          <div class="picker-group" data-g="s">
            ${swasta.map(s => `<div class="picker-option" data-v="${esc(s.Nama)}" data-s="${esc(s.Nama.toUpperCase())}">${esc(s.Nama)}</div>`).join('')}
          </div>
          <div class="picker-option manual-option" data-v="__manual__">⚠ Sekolah tidak ada di daftar (isi manual)</div>
        </div>
      </div>
    </div>
    <div id="manualWrap" style="display:none;margin-top:.5rem;">
      <div style="background:var(--gold-l);padding:.8rem;border-radius:8px;border:1px solid var(--gold);">
        <p style="font-size:.75rem;font-weight:800;color:#92400e;margin-bottom:.4rem;">Ketik Nama Sekolah:</p>
        <input type="text" class="form-input" id="inpManual" placeholder="NAMA SEKOLAH..." style="text-transform:uppercase;">
      </div>
    </div>
  `;

  const trigger = $('#pTrigger'), dropdown = $('#pDropdown'), search = $('#pSearch');
  const manualWrap = $('#manualWrap'), inpManual = $('#inpManual');

  trigger.onclick = (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('show');
    trigger.classList.toggle('active');
    if (dropdown.classList.contains('show')) {
      search.value = ''; filterList(''); setTimeout(() => search.focus(), 100);
    }
  };

  document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target) && !trigger.contains(e.target)) {
      dropdown.classList.remove('show'); trigger.classList.remove('active');
    }
  });

  search.oninput = (e) => filterList(e.target.value);

  function filterList(q) {
    q = q.toUpperCase();
    dropdown.querySelectorAll('.picker-group').forEach(g => {
      let has = false;
      g.querySelectorAll('.picker-option').forEach(o => {
        if (!q || o.dataset.s.includes(q)) { o.style.display = 'flex'; has = true; }
        else { o.style.display = 'none'; }
      });
      g.style.display = has ? 'block' : 'none';
      g.previousElementSibling.style.display = has ? 'block' : 'none';
    });
  }

  dropdown.querySelectorAll('.picker-option').forEach(o => {
    o.onclick = () => {
      const v = o.dataset.v;
      if (v === '__manual__') {
        manualWrap.style.display = 'block'; inpManual.value = ''; inpManual.focus();
        trigger.querySelector('span').innerHTML = '<span class="placeholder">Isi manual di bawah...</span>';
        onSelect('', true);
      } else {
        manualWrap.style.display = 'none';
        trigger.querySelector('span').textContent = v;
        trigger.querySelector('span').classList.remove('placeholder');
        onSelect(v, false);
      }
      dropdown.querySelectorAll('.picker-option').forEach(x => x.classList.remove('selected'));
      if (v !== '__manual__') o.classList.add('selected');
      dropdown.classList.remove('show'); trigger.classList.remove('active');
    };
  });

  if (inpManual) {
    inpManual.oninput = (e) => {
      e.target.value = e.target.value.toUpperCase();
      onSelect(e.target.value, true);
    };
  }
}

 * SCREEN: FORM PESERTA
 * ============================================================ */
function renderForm(cabangKey, existingPeserta = null) {
  const cab = State.cabangMap[cabangKey];
  if (!cab) return;
  
  const isEdit = !!existingPeserta;
  State.currentForm = {
    cabang: cabangKey,
    id: existingPeserta ? existingPeserta.ID : null,
    asalSekolah: existingPeserta ? existingPeserta.Asal_Sekolah : '',
    isManual: existingPeserta ? String(existingPeserta.Catatan||'').includes('Sekolah manual') : false,
    members: cab.team
      ? [0,1,2].map(i => {
          return {
            nama: existingPeserta ? (i === 0 ? existingPeserta.Nama_Lengkap : existingPeserta[`Anggota_${i+1}`]) || '' : '',
            jk: existingPeserta ? (i === 0 ? existingPeserta.Jenis_Kelamin : existingPeserta[`JK_${i+1}`]) || '' : '',
            nisn: existingPeserta ? (i === 0 ? existingPeserta.NISN : existingPeserta[`NISN_${i+1}`]) || '' : '',
            tl: existingPeserta ? (i === 0 ? existingPeserta.Tempat_Lahir : existingPeserta[`Tempat_Lahir_${i+1}`]) || '' : '',
            tgl: existingPeserta ? (i === 0 ? existingPeserta.Tanggal_Lahir : existingPeserta[`Tanggal_Lahir_${i+1}`]) || '' : '',
            kelas: existingPeserta ? (i === 0 ? existingPeserta.Kelas : existingPeserta[`Kelas_${i+1}`]) || '' : ''
          };
        })
      : [{
          nama: existingPeserta ? existingPeserta.Nama_Lengkap : '',
          jk: existingPeserta ? existingPeserta.Jenis_Kelamin : '',
          nisn: existingPeserta ? existingPeserta.NISN : '',
          tl: existingPeserta ? existingPeserta.Tempat_Lahir : '',
          tgl: existingPeserta ? existingPeserta.Tanggal_Lahir : '',
          kelas: existingPeserta ? existingPeserta.Kelas : ''
        }]
  };

  setAppbar({ show: true, back: true, title: isEdit ? 'Edit Peserta' : 'Tambah Peserta', sub: cab.kode });
  $('#btnBack').onclick = renderDashboard;

  showScreen('form', s => {
    const mArr = State.currentForm.members;
    s.innerHTML = `
      <div class="card">
        <div class="form-group">
          <label>Asal Sekolah <span class="req">*</span></label>
          <div id="pickerContainer"></div>
        </div>
      </div>

      <div class="form-grid">
        ${mArr.map((m, i) => renderMemberInputs(m, i, cab.team)).join('')}
      </div>

      <button class="btn btn-primary" id="btnSave" style="margin-top:1rem;">Simpan Data ${cab.kode}</button>
    `;

    renderPickerUI($('#pickerContainer'), State.sekolah, (val, isMan) => {
      State.currentForm.asalSekolah = val;
      State.currentForm.isManual = isMan;
    });
    
    // Prefill picker trigger if edit
    if (State.currentForm.asalSekolah && !State.currentForm.isManual) {
      const trig = $('#pTrigger');
      if (trig) {
        trig.querySelector('span').textContent = State.currentForm.asalSekolah;
        trig.querySelector('span').classList.remove('placeholder');
        $('#pDropdown').querySelectorAll('.picker-option').forEach(o => {
          if (o.dataset.v === State.currentForm.asalSekolah) o.classList.add('selected');
        });
      }
    }

    bindInputs();

    $('#btnSave').onclick = () => {
      const payload = validateForm(cab);
      if (payload) doSave(cab, payload);

  });

function bindInputs() {
  $$('.f-nama').forEach(inp => inp.oninput = e => { e.target.value = e.target.value.toUpperCase(); State.currentForm.members[e.target.dataset.i].nama = e.target.value; });
  $$('.f-nisn').forEach(inp => inp.oninput = e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0,10); State.currentForm.members[e.target.dataset.i].nisn = e.target.value; });
  $$('.f-tl').forEach(inp => inp.oninput = e => { State.currentForm.members[e.target.dataset.i].tl = e.target.value; });
  $$('.f-tgl').forEach(inp => inp.onchange = e => { State.currentForm.members[e.target.dataset.i].tgl = e.target.value; });
  $$('.f-kelas').forEach(inp => inp.onchange = e => { State.currentForm.members[e.target.dataset.i].kelas = e.target.value; });
  $$('.f-jk').forEach(btn => btn.onclick = () => {
    const i = btn.dataset.i;
    State.currentForm.members[i].jk = btn.dataset.val;
    $$(`.f-jk[data-i="${i}"]`).forEach(b => b.classList.toggle('active', b === btn));
  });
}

function validateForm(cab) {
  const f = State.currentForm;
  if (!f.asalSekolah || f.asalSekolah.length < 3) { toast('Asal sekolah wajib diisi.', 'error'); return null; }
  
  for (let i=0; i<f.members.length; i++) {
    const m = f.members[i];
    const lbl = cab.team ? `Anggota ${i+1}` : 'Peserta';
    if (!m.nama || m.nama.length < 3) { toast(`${lbl}: Nama minimal 3 karakter.`, 'error'); return null; }
    if (!['L','P'].includes(m.jk)) { toast(`${lbl}: Pilih jenis kelamin.`, 'error'); return null; }
    if (!/^\d{10}$/.test(m.nisn)) { toast(`${lbl}: NISN harus 10 digit.`, 'error'); return null; }
    if (!m.tl || m.tl.length < 3) { toast(`${lbl}: Tempat lahir wajib.`, 'error'); return null; }
    if (!m.tgl) { toast(`${lbl}: Tanggal lahir wajib.`, 'error'); return null; }
    if (!m.kelas) { toast(`${lbl}: Kelas wajib.`, 'error'); return null; }
  }

  if (cab.team) {
    const nisns = f.members.map(m => m.nisn);
    if (new Set(nisns).size !== 3) { toast('NISN anggota harus berbeda.', 'error'); return null; }
  }
  if (cab.gender === 'L' && f.members[0].jk !== 'L') { toast('Cabang Adzan hanya untuk putra.', 'error'); return null; }

  const p = {
    Cabang: cab.key,
    Asal_Sekolah: f.asalSekolah,
    Sekolah_Manual: f.isManual,
    Nama_Lengkap: f.members[0].nama,
    Jenis_Kelamin: f.members[0].jk,
    NISN: f.members[0].nisn,
    Tempat_Lahir: f.members[0].tl,
    Tanggal_Lahir: f.members[0].tgl,
    Kelas: f.members[0].kelas
  };
  if (cab.team) {
    p.Anggota_2 = f.members[1].nama; p.JK_2 = f.members[1].jk; p.NISN_2 = f.members[1].nisn; p.Tempat_Lahir_2 = f.members[1].tl; p.Tanggal_Lahir_2 = f.members[1].tgl; p.Kelas_2 = f.members[1].kelas;
    p.Anggota_3 = f.members[2].nama; p.JK_3 = f.members[2].jk; p.NISN_3 = f.members[2].nisn; p.Tempat_Lahir_3 = f.members[2].tl; p.Tanggal_Lahir_3 = f.members[2].tgl; p.Kelas_3 = f.members[2].kelas;
  }
  return p;
}

async function doSave(cab, payload) {
  const btn = $('#btnSave'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const isEdit = !!State.currentForm.id;
  try {
    const res = await api(isEdit ? 'update_peserta' : 'daftar_peserta', { id: State.currentForm.id, payload });
    if (res.error) throw new Error(res.message || (res.messages && res.messages[0]));
    
    toast(isEdit ? 'Data diperbarui.' : 'Peserta terdaftar.', 'success');
    
    // Refresh
    const list = await api('list_peserta');
    State.peserta = list.peserta || [];
    State.slotTerpakai = list.slot_terpakai || 0;
    
    // Jika tambah baru, langsung ke upload
    if (!isEdit && res.id) {
      const newP = State.peserta.find(p => p.ID === res.id);
      renderUpload(cab.key, newP);
    } else {
      renderDashboard();
    }
  } catch (e) {
    toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Simpan Data';
  }
}

/* ============================================================
 * SCREEN: UPLOAD AKTA
 * ============================================================ */
function renderUpload(cabangKey, peserta) {
  const cab = State.cabangMap[cabangKey];
  setAppbar({ show: true, back: true, title: 'Upload Akta', sub: cab.kode });
  $('#btnBack').onclick = renderDashboard;

  showScreen('upload', s => {
    s.innerHTML = `
      <div class="card">
        <h3 style="font-size:1.1rem;color:var(--rose-deep);margin-bottom:.2rem;">${esc(peserta.Nama_Lengkap)}</h3>
        <p style="font-size:.85rem;color:var(--ink-l);margin-bottom:1.5rem;">Format JPG/PNG/PDF. Maks 2 MB.</p>
        <div id="aktaContainer"></div>
      </div>
      <button class="btn btn-primary" id="btnDone" style="margin-top:1rem;">Selesai & Kembali ke Dashboard</button>
    `;
    
    const isTeam = cab.team;
    const aktaKeys = isTeam ? ['akta1','akta2','akta3'] : ['akta1'];
    
    $('#aktaContainer').innerHTML = aktaKeys.map((k, i) => renderUploadBox(peserta, k, i)).join('');
    
    aktaKeys.forEach((k, i) => {
      const box = $(`#box-${k}`);
      if (!box) return;
      const input = box.querySelector('input[type="file"]');
      if (input) input.onchange = e => handleFile(e.target.files[0], k, peserta.ID, isTeam, i);
    });
    
    $('#btnDone').onclick = renderDashboard;
  });
}

function renderUploadBox(p, key, i) {
  const isUploaded = p[`has_${key}`];
  const label = key === 'akta1' ? (p.Cabang === 'LCP' ? 'Akta Ketua' : 'Akta Kelahiran') : `Akta Anggota ${i+1}`;
  return `
    <div class="upload-box ${isUploaded ? 'has-file' : ''}" id="box-${key}">
      <div class="upload-icon">
        ${isUploaded 
          ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`}
      </div>
      <div class="upload-info">
        <div class="upload-title">${label}</div>
        <div class="upload-sub">${isUploaded ? 'Berkas tersimpan' : 'Klik untuk unggah'}</div>
      </div>
      ${!isUploaded ? `<input type="file" class="upload-btn" accept="image/jpeg,image/png,application/pdf" style="display:none;">` : ''}
    </div>
  `;
}

async function handleFile(file, key, id, isTeam, i) {
  if (!file) return;
  if (file.size > 10*1024*1024) return toast('Maks 10MB', 'error');
  const box = $(`#box-${key}`);
  box.classList.add('uploading');
  box.querySelector('.upload-sub').textContent = 'Mengunggah...';
  
  try {
    const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(file); });
    const res = await api('upload_berkas', {
      peserta_id: id, jenis: key, file_base64: b64, mime_type: file.type, file_name: file.name
    });
    if (res.error) throw new Error(res.message);
    
    toast('Berhasil diunggah', 'success');
    box.classList.remove('uploading');
    box.classList.add('has-file');
    box.querySelector('.upload-icon').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`;
    box.querySelector('.upload-sub').textContent = 'Berkas tersimpan';
    const input = box.querySelector('input[type="file"]');
    if (input) input.remove();
    
    const p = State.peserta.find(x => x.ID === id);
    if (p) {
      p[`has_${key}`] = true;
      const need = isTeam ? 3 : 1;
      let count = ['akta1','akta2','akta3'].filter(k => p[`has_${k}`]).length;
      if (count >= need) p.berkas_lengkap = true;
    }
  } catch(e) {
    toast(e.message, 'error');
    box.classList.remove('uploading');
    box.querySelector('.upload-sub').textContent = 'Gagal. Coba lagi.';
  }
}

/* ============================================================
 * AKSI HAPUS & SUBMIT
 * ============================================================ */
async function doDelete(p) {
  if (!confirm(`Hapus data ${p.Nama_Lengkap}? Berkas akta juga akan terhapus.`)) return;
  try {
    const res = await api('hapus_peserta', { id: p.ID });
    if (res.error) throw new Error(res.message);
    toast('Peserta dihapus.', 'success');
    boot();
  } catch (e) { toast(e.message, 'error'); }
}

async function doSubmitFinal() {
  if (!confirm('Kunci data peserta? Setelah dikunci tidak dapat diubah.')) return;
  const btn = $('#btnFinal'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const res = await api('submit_final_ofisial');
    if (res.error) throw new Error(res.message);
    toast('Data berhasil dikunci.', 'success');
    boot();
  } catch (e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = 'Kunci & Submit Final';
  }
}

/* ============================================================
 * BOOTSTRAP
 * ============================================================ */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
else boot();

})();
</script>
</body>
</html>
